<!doctype html>
<meta charset="utf-8">
<title>Line-up art: burnt-out photocopy portraits</title>
<style>
  body { margin: 0; padding: 20px; width: 720px; box-sizing: border-box; background: #f6f3ec; color: #1d1b18;
    font: 14px/1.35 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: #6b665d; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .card { background: #fff; border: 1.5px solid #d9d4c8; border-radius: 10px; padding: 8px; }
  .card svg { width: 100%; height: auto; display: block; }
  .name { font-weight: 650; font-size: 12.5px; margin-top: 5px; }
</style>
<h1>Line-up art: burnt-out photocopy</h1>
<p class="sub">No height chart, no placard. Every face is built from parts by src/portrait.js. Needs <code>npm run serve</code>.</p>
<div id="defs"></div>
<div class="row" id="grid"></div>
<script type="module">
import { PORTRAIT_DEFS, portrait } from '../src/portrait.js';
const PEOPLE = [
  ['Odile, pastry chef', { hair: 'bob', hat: 'toque', top: 'chef', topTone: 'light', brows: 'flat', mouth: 'flat' }],
  ['Bram, glaciologist', { face: 1, hair: 'crop', hat: 'beanie', glasses: 'round', top: 'parka', topTone: 'dark', mouth: 'smile', light: 'r' }],
  ['Wendell, long-haul trucker', { face: 2, tone: 1, hair: 'crop', hairTone: 'light', hat: 'cap', beard: 'handlebar', top: 'plaid', brows: 'stern' }],
  ['Ines, auditor', { face: 3, hair: 'bun', glasses: 'square', top: 'blazer', topTone: 'dark', brows: 'raised', mouth: 'smirk', extra: 'earrings' }],
  ['Kofi, bike courier', { tone: 2, hair: 'buzz', hat: 'helmet', top: 'tee', topTone: 'dark', mouth: 'grin', light: 'r' }],
  ['Petra, beekeeper', { face: 1, tone: 1, hair: 'long', hairTone: 'light', hat: 'strawhat', top: 'overalls', topTone: 'light', mouth: 'smile', extra: 'freckles' }],
  ['Anselm, piano tuner', { face: 3, hair: 'receding', hairTone: 'grey', beard: 'full', glasses: 'round', top: 'turtleneck', topTone: 'dark', brows: 'worried' }],
  ['Yuki, sound engineer', { hair: 'fringe', hat: 'headphones', top: 'hoodie', topTone: 'dark', mouth: 'o', extra: 'mic' }],
  ['Rosalind, welder', { face: 2, tone: 2, hair: 'afro', top: 'hiviz', topTone: 'mid', brows: 'thick', mouth: 'smirk', light: 'r' }],
  ['Tomas, sommelier', { hair: 'part', beard: 'moustache', top: 'shirt', topTone: 'light', extra: 'bowtie', brows: 'raised' }],
  ['Mirela, nurse', { face: 1, tone: 1, hair: 'ponytail', top: 'scrubs', topTone: 'mid', extra: 'stethoscope', mouth: 'smile' }],
  ['Dov, magician', { face: 3, hair: 'curly', hat: 'tophat', beard: 'goatee', top: 'blazer', topTone: 'dark', brows: 'stern', mouth: 'smirk', extra: 'monocle', light: 'r' }],
];
document.getElementById('defs').innerHTML = PORTRAIT_DEFS;
document.getElementById('grid').innerHTML = PEOPLE.map(([name, look], i) =>
  `<div class="card">${portrait(look, i + 1)}<div class="name">${name}</div></div>`).join('');
</script>
