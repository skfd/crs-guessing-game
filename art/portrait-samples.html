<!doctype html>
<meta charset="utf-8">
<title>Line-up art: burnt-out photocopy portraits</title>
<style>
  body { margin: 0; padding: 20px; width: 720px; box-sizing: border-box; background: #f6f3ec; color: #1d1b18;
    font: 14px/1.35 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: #6b665d; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .card { background: #fff; border: 1.5px solid #d9d4c8; border-radius: 10px; padding: 8px; }
  .card svg { width: 100%; height: auto; display: block; }
  .name { font-weight: 650; font-size: 12.5px; margin-top: 5px; }
</style>
<h1>Line-up art: burnt-out photocopy</h1>
<p class="sub">No height chart, no placard. Every face is built from parts by src/portrait.js. Needs <code>npm run serve</code>.</p>
<div id="defs"></div>
<div class="row" id="grid"></div>
<script type="module">
import { PORTRAIT_DEFS, portrait } from '../src/portrait.js';
const PEOPLE = [
  ['narrow head, slight build, tone 0', { face: 3, headW: 0.86, headH: 1.08, build: 0.84, neck: 17, hair: 'fringe', top: 'tee', eyes: 'round', nose: 'narrow', age: 0 }],
  ['wide head, broad build, tone 1', { face: 2, headW: 1.16, headH: 0.94, build: 1.2, neck: 28, slope: 1.06, tone: 1, hair: 'buzz', beard: 'stubble', top: 'plaid', nose: 'wide', brows: 'thick' }],
  ['tone 2, coils, full lips', { face: 1, tone: 2, hair: 'coils', top: 'vneck', topTone: 'light', lips: 'full', eyes: 'wide', mouth: 'smile', light: 'r' }],
  ['tone 3, locs, glasses', { face: 4, tone: 3, hair: 'locs', glasses: 'round', top: 'shirt', topTone: 'light', mouth: 'smile', headW: 0.95 }],
  ['tone 4, braids', { face: 0, tone: 4, hair: 'braids', top: 'blazer', topTone: 'light', lips: 'full', extra: 'earrings', light: 'r' }],
  ['tone 4, bald, heavy jaw, old', { face: 5, tone: 4, hair: 'bald', beard: 'full', hairTone: 'light', top: 'turtleneck', topTone: 'light', age: 3, headW: 1.08, build: 1.12, neck: 26 }],
  ['old, thin hair, tone 0', { face: 3, hair: 'thin', hairTone: 'grey', age: 3, glasses: 'square', top: 'shirt', nose: 'long', mouth: 'frown', sit: 5, tilt: -4 }],
  ['middle-aged, wavy, tone 1', { face: 1, tone: 1, hair: 'wavy', age: 2, top: 'scarf', topTone: 'dark', eyes: 'hooded', mouth: 'smirk', tilt: 4 }],
  ['young, small in frame', { face: 4, hair: 'pigtails', age: 0, top: 'hoodie', topTone: 'light', eyes: 'round', nose: 'button', mouth: 'grin', sit: 12, size: 0.9, build: 0.86, neck: 18 }],
  ['invented: coil wrap', { face: 2, tone: 2, hat: 'coil', beard: 'long', top: 'yoke', topTone: 'dark', brows: 'thick', nose: 'wide', headW: 1.05, build: 1.1 }],
  ['invented: veil with brow dots', { face: 0, tone: 1, hat: 'veil', top: 'tee', topTone: 'dark', eyes: 'almond', mouth: 'smile', glasses: 'round' }],
  ['invented: halo disc', { face: 3, tone: 3, hair: 'bun', hat: 'halo', top: 'cloak', topTone: 'dark', extra: 'browdots', light: 'r' }],
  ['invented: twin peaks, ruff', { face: 4, hair: 'long', hairTone: 'light', hat: 'peaks', top: 'ruff', topTone: 'dark', mouth: 'smirk', age: 2 }],
  ['invented: cowl', { face: 5, tone: 2, hat: 'cowl', beard: 'goatee', top: 'cloak', topTone: 'mid', brows: 'stern', nose: 'long', age: 2, headW: 0.94 }],
  ['invented: bead band, neck rings', { face: 1, tone: 4, hair: 'buzz', hat: 'beadband', top: 'vneck', topTone: 'light', extra: 'neckrings', lips: 'full', neck: 20, headH: 1.06 }],
  ['everyday: toque, parka, tone 3', { face: 2, tone: 3, hair: 'crop', hat: 'beanie', top: 'parka', topTone: 'light', glasses: 'square', beard: 'moustache', mouth: 'grin', age: 2, build: 1.15, neck: 26 }],
];
document.getElementById('defs').innerHTML = PORTRAIT_DEFS;
document.getElementById('grid').innerHTML = PEOPLE.map(([name, look], i) =>
  `<div class="card">${portrait(look, i + 1)}<div class="name">${name}</div></div>`).join('');
</script>
